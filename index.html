<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lee's GOTY Tier List Final?</title>

<style>
:root{
    --bg:#0f1117;
    --panel:#181c24;
    --panel-hover:#242b3d;
    --border:#30364a;
    --text:#edf1f7;
    --muted:#9da6b8;

    --s:#ffb703;
    --a:#90be6d;
    --b:#4cc9f0;
    --c:#c77dff;
    --d:#808080;
    --dnf:#8b0000;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,system-ui,sans-serif;
    line-height:1.6;
}

.container{
    width:min(1400px,95%);
    margin:auto;
    padding:20px;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:2.5rem;
}

header p{
    color:var(--muted);
}

.tier{
    margin-bottom:28px;
}

.tier-header{
    padding:14px 18px;
    font-size:1.3rem;
    font-weight:bold;
    border-radius:12px;
    margin-bottom:12px;
}

.tier-s{
    background:var(--s);
    color:black;
}

.tier-a{
    background:var(--a);
    color:black;
}

.tier-b{
    background:var(--b);
    color:black;
}

.tier-c{
    background:var(--c);
}

.tier-d{
    background:var(--d);
}

.tier-dnf{
    background:var(--dnf);
}

.game-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

@media(min-width:700px){

    .game-grid{
        grid-template-columns:
        repeat(auto-fill,minmax(150px,1fr));
    }
}

.game-card{
    background:var(--panel);
    border-radius:12px;
    overflow:hidden;
    border:2px solid transparent;
    cursor:pointer;
    transition:.2s;
}

.game-card:hover{
    transform:translateY(-3px);
    background:var(--panel-hover);
}

.game-card.active{
    border-color:white;
    transform:translateY(-3px);
    box-shadow:
        0 0 0 2px white,
        0 0 20px rgba(255,255,255,.25);
}
    
.game-card img{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    display:block;
}

.game-title{
    padding:8px;
    text-align:center;
    font-size:.85rem;
}

.review-card{
    grid-column:1 / -1;
    margin-top:15px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
}

.review-layout{
    display:block;
}

.review-image{
    width:100%;
    display:block;
    object-fit:cover;
}

.review-content{
    padding:22px;
}

.review-title{
    font-size:2rem;
    margin-bottom:10px;
}

.review-tier{
    display:inline-block;
    padding:6px 14px;
    border-radius:999px;
    font-weight:bold;
    margin-bottom:20px;
}

.review-text{
    white-space:pre-line;
}

.nav-buttons{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.nav-buttons button{
    background:#39415a;
    color:white;
    border:none;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
}

.nav-buttons button:hover{
    background:#4a5470;
}

@media(min-width:900px){

    .review-layout{
        display:grid;
        grid-template-columns:320px 1fr;
    }

    .review-image{
        height:100%;
    }
}
</style>
</head>
<body>

<header>
    <h1>🏆 Lee's GOTY Tier List</h1>

<div id="tiers"></div>

<script>

{
title:"No Rest for the Wicked",
tier:"S",
image:"images/No Rest For The Wicked.jpg",
review:`No Rest for the Wicked is a game that's as fun to play alone as it is with a group, which is something I don't think I've experienced for a long time. It highlights a lot of issues with other games in the surrounding genres like ARPGs and Souls games and legitimately does its best to address them. The multiplayer servers acting as persistent worlds makes them feel so much more like they belong to the group, and building up Sacrament together is a joy, even if you have a private server of your own. Disappointing not to see it leave early access this year as planned, but if it continues on the path its already set then it's likely to be my favourite game next year as well.`
},

{
title:"Order of the Sinking Star",
tier:"S",
image:"images/Order Of The Sinking Star.jpg",
review:`It's been 10 years since The Witness, and Thekla have tried once again to make something that's not quite been made before. It's not quite as creative as The Witness, which genuinely did fuse the 3D world and the 2D line puzzles in a way that led to constant moments of discovery, but it comes pretty close - even if it takes much (much) longer to get there. It's a Sokoban, which for the unfamiliar is a block-pushing puzzle, ranging in complexity from the one included in my daughter's digital camera to the mind-bogglingly difficult Baba Is You. It actually begins with four existing indie sokobans which you learn the mechanics of and play as you head out in the cardinal directions, but as you explore the map these games' mechanics come together in new and sometimes unexpected ways. There are some genuine moments of discovery here, but the most profound probably occurs near the end credits (which was 70 hours and 400 puzzles for me personally), so you really can't just dip your toe in and expect excitement - you have to find intrinsic joy in solving the puzzles along the way. If you do enjoy that then you'll likely find the best puzzle game since, well, The Witness.`
},

{
title:"Slay the Spire 2",
tier:"S",
image:"images/Slay The Spire 2.png",
review:`I had low expectations for Slay The Spire 2, not that I didn't think Mega Crit had it in them, but being the one who spawned a new genre and hundreds of copycats of varying quality (some genuinely great ones!) can be a lot of pressure, and StS2 was by all early impressions looking to be very much the same game as StS. And it was, almost exactly the same. Most of the characters are the same, most of the cards are the same, many of the relics and structure and types of events are the same. But it turns out none of that mattered because I STILL spent hundreds of hours on it completing everything up to Ascension 10 on every character. Another Early Access title takes one of my top spots, but even though Act 4 isn't out yet it's already the best in the genre. It's better than Slay the Spire, which was already the best, so really this outcome was inevitable. `
},

const tierOrder = ["S","A","B","C","D","DNF"];

let currentGame = null;

function getTierClass(tier){

    if(tier === "DNF"){
        return "tier-dnf";
    }

    return `tier-${tier.toLowerCase()}`;
}

function getTierText(tier){

    if(tier === "DNF"){
        return "Did Not Finish";
    }

    return `${tier} Tier`;
}

function showReview(game){

    currentGame = game;

    document
        .querySelectorAll(".review-card")
        .forEach(card => card.remove());

    document
        .querySelectorAll(".game-card")
        .forEach(card => card.classList.remove("active"));

    const selectedCard = document.querySelector(
        `[data-title="${CSS.escape(game.title)}"]`
    );

    selectedCard.classList.add("active");

    const reviewCard = document.createElement("div");

    reviewCard.className = "review-card";

reviewCard.innerHTML = `
    <div class="review-content">

            <div class="nav-buttons">
                <button onclick="previousGame()">
                    ← Previous
                </button>
            
                <button onclick="closeReview()">
                    ✕ Close
                </button>
            
                <button onclick="nextGame()">
                    Next →
                </button>
            </div>


                <div class="review-title">
                    ${game.title}
                </div>

                <div class="review-tier ${getTierClass(game.tier)}">
                    ${getTierText(game.tier)}
                </div>

                <div class="review-text">
                    ${game.review}
                </div>
        </div>
    `;

const grid =
    selectedCard.closest(".game-grid");

const cards =
    Array.from(
        grid.querySelectorAll(".game-card")
    );

const cardIndex =
    cards.indexOf(selectedCard);

const columns =
    window.innerWidth < 700
        ? 3
        : Math.max(
            1,
            Math.round(
                grid.offsetWidth /
                selectedCard.offsetWidth
            )
        );

const endOfRow =
    Math.min(
        cards.length - 1,
        Math.floor(cardIndex / columns) *
        columns +
        (columns - 1)
    );

cards[endOfRow]
    .insertAdjacentElement(
        "afterend",
        reviewCard
    );

selectedCard.scrollIntoView({
    behavior:"smooth",
    block:"start"
});
}

function nextGame(){

    const index = games.findIndex(
        game => game.title === currentGame.title
    );

    const next =
        games[(index + 1) % games.length];

    showReview(next);
}

function previousGame(){

    const index = games.findIndex(
        game => game.title === currentGame.title
    );

    const previous =
        games[
          (index - 1 + games.length)
          % games.length
        ];

    showReview(previous);
}

   function closeReview(){

    const activeCard =
        document.querySelector(".game-card.active");

    document
        .querySelectorAll(".review-card")
        .forEach(card => card.remove());

    document
        .querySelectorAll(".game-card")
        .forEach(card =>
            card.classList.remove("active")
        );

    currentGame = null;

    activeCard?.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });
}
    
const tiersContainer =
    document.getElementById("tiers");

tierOrder.forEach(tier => {

    const tierGames =
        games.filter(game => game.tier === tier);

    const section =
        document.createElement("section");

    section.className = "tier";

    section.innerHTML = `
        <div class="tier-header ${getTierClass(tier)}">
            ${getTierText(tier)}
        </div>

        <div class="game-grid">

            ${tierGames.map(game => `

                <div
                    class="game-card"
                    data-title="${game.title}">

                    <img
                        src="${game.image}"
                        alt="${game.title}">

                    <div class="game-title">
                        ${game.title}
                    </div>

                </div>

            `).join("")}

        </div>
    `;

    tiersContainer.appendChild(section);
});

document.addEventListener("click", event => {

    const card =
        event.target.closest(".game-card");

    if(!card) return;

    const game =
        games.find(
            g => g.title === card.dataset.title
        );

    if(!game) return;

    const isAlreadyOpen =
        currentGame &&
        currentGame.title === game.title;

    if(isAlreadyOpen){

        document
            .querySelectorAll(".review-card")
            .forEach(card => card.remove());

        document
            .querySelectorAll(".game-card")
            .forEach(card =>
                card.classList.remove("active")
            );

        currentGame = null;

        return;
    }

    showReview(game);

});

</script>
