<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lee's GOTY Tier List</title>

<style>
:root{
    --bg:#0f1117;
    --panel:#181c24;
    --panel-hover:#222838;
    --border:#30364a;
    --text:#e8eaf0;
    --muted:#9da5b7;

    --s:#ffb703;
    --a:#90be6d;
    --b:#4cc9f0;
    --c:#c77dff;
    --d:#6c757d;
    --dnf:#8b0000;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Segoe UI, system-ui, sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
}

.container{
    width:min(1200px,95%);
    margin:auto;
    padding:20px;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:2.5rem;
    margin-bottom:10px;
}

header p{
    color:var(--muted);
}

.review-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:30px;
}

.placeholder{
    padding:60px 20px;
    text-align:center;
    color:var(--muted);
}

.review-layout{
    display:block;
}

.review-cover{
    width:100%;
    display:block;
    object-fit:cover;
}

.review-content{
    padding:20px;
}

.review-title{
    font-size:2rem;
    margin-bottom:10px;
}

.review-tier{
    display:inline-block;
    padding:6px 12px;
    border-radius:999px;
    font-weight:bold;
    margin-bottom:15px;
}

.review-text{
    white-space:pre-line;
}

.tier{
    margin-bottom:25px;
}

.tier-header{
    padding:12px 16px;
    font-size:1.3rem;
    font-weight:bold;
    border-radius:12px;
    margin-bottom:10px;
}

.tier-s{background:var(--s);color:#000;}
.tier-a{background:var(--a);color:#000;}
.tier-b{background:var(--b);color:#000;}
.tier-c{background:var(--c);}
.tier-d{background:var(--d);}
.tier-dnf{background:var(--dnf);}

.game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:12px;
}

.game-card{
    background:var(--panel);
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    border:2px solid transparent;
    transition:0.2s;
}

.game-card:hover{
    transform:translateY(-3px);
    background:var(--panel-hover);
}

.game-card.active{
    border-color:white;
}

.game-card img{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    display:block;
}

.game-title{
    padding:8px;
    font-size:0.85rem;
    text-align:center;
}

@media (min-width:900px){

    .review-layout{
        display:grid;
        grid-template-columns:300px 1fr;
    }

    .review-cover{
        height:100%;
    }
}
</style>
</head>
<body>

const tierOrder = ["S","A","B","C","D","DNF"];

function getTierClass(tier){
    if(tier === "DNF") return "tier-dnf";
    return `tier-${tier.toLowerCase()}`;
}

const reviewPanel = document.getElementById("reviewPanel");
const tiersContainer = document.getElementById("tiers");

function showGame(game){

    reviewPanel.innerHTML = `
    <div class="review-layout">

        <img
            class="review-cover"
            src="${game.image}"
            alt="${game.title}">

        <div class="review-content">

            <div class="review-title">
                ${game.title}
            </div>

            <div class="review-tier ${getTierClass(game.tier)}">
                ${game.tier === "DNF" ? "Did Not Finish" : game.tier + " Tier"}
            </div>

            <div class="review-text">
                ${game.review}
            </div>

        </div>

    </div>
    `;

    document
        .querySelectorAll(".game-card")
        .forEach(card => card.classList.remove("active"));

    document
        .querySelector(`[data-title="${game.title}"]`)
        ?.classList.add("active");
}

tierOrder.forEach(tier => {

    const tierGames = games.filter(game => game.tier === tier);

    const section = document.createElement("section");
    section.className = "tier";

    section.innerHTML = `
    <div class="tier-header ${getTierClass(tier)}">
        ${tier === "DNF" ? "Did Not Finish" : tier + " Tier"}
    </div>

    <div class="game-grid">

        ${tierGames.map(game => `

        <div
            class="game-card"
            data-title="${game.title}">

            <img
                src="${game.image}"
                alt="${game.title}">

            <div class="game-title">
                ${game.title}
            </div>

        </div>

        `).join("")}

    </div>
    `;

    tiersContainer.appendChild(section);

});

document.addEventListener("click", e => {

    const card = e.target.closest(".game-card");

    if(!card) return;

    const game = games.find(
        g => g.title === card.dataset.title
    );

    if(game){
        showGame(game);
    }

});
