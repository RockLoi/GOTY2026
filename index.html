<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lee's GOTY Tier List</title>

<style>

:root{
    --bg:#0f1117;
    --panel:#181c24;
    --panel-hover:#242b3d;
    --border:#30364a;
    --text:#edf1f7;
    --muted:#9da6b8;

    --s:#ffb703;
    --a:#90be6d;
    --b:#4cc9f0;
    --c:#c77dff;
    --d:#808080;
    --dnf:#8b0000;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,system-ui,sans-serif;
    line-height:1.6;
}

.container{
    width:min(1400px,95%);
    margin:auto;
    padding:20px;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:2.5rem;
}

header p{
    color:var(--muted);
}

.tier{
    margin-bottom:20px;
}

.tier-header{
    padding:14px 18px;
    font-size:1.3rem;
    font-weight:bold;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.tier-header::after{
    content:"▼";
    transition:0.2s;
}

.tier.collapsed .tier-header::after{
    transform:rotate(-90deg);
}

.tier.collapsed .tier-content{
    display:none;
}

.tier-s{background:var(--s);color:black;}
.tier-a{background:var(--a);color:black;}
.tier-b{background:var(--b);color:black;}
.tier-c{background:var(--c);}
.tier-d{background:var(--d);}
.tier-dnf{background:var(--dnf);}

.game-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

@media(min-width:700px){

    .game-grid{
        grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    }
}

.game-card{
    background:var(--panel);
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    border:2px solid transparent;
    transition:0.2s;
}

.game-card:hover{
    transform:translateY(-3px);
    background:var(--panel-hover);
}

.game-card.active{
    border-color:white;
}

.game-card img{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    display:block;
}

.game-title{
    padding:8px;
    text-align:center;
    font-size:.85rem;
}

.review-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    margin-top:15px;
    overflow:hidden;
}

.review-layout{
    display:block;
}

.review-image{
    width:100%;
    display:block;
    object-fit:cover;
}

.review-content{
    padding:20px;
}

.review-title{
    font-size:2rem;
    margin-bottom:10px;
}

.review-text{
    white-space:pre-line;
}

.nav-buttons{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.nav-buttons button{
    border:none;
    background:#2f374d;
    color:white;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
}

.nav-buttons button:hover{
    background:#404a63;
}

@media(min-width:900px){

    .review-layout{
        display:grid;
        grid-template-columns:320px 1fr;
    }

    .review-image{
        height:100%;
    }
}

</style>
</head>
<body>

<div class="container">

<header>
<h1>🏆 Lee's GOTY Tier List</h1>
<p>Big year means big tier list.</p>
</header>

<div id="tiers"></div>

</div>

<script>

const games = [

{title:"No Rest for the Wicked",tier:"S",image:"images/No Rest For The Wicked.jpg",review:"Replace with review text."},
{title:"Order of the Sinking Star",tier:"S",image:"images/Order Of The Sinking Star.jpg",review:"Replace with review text."},
{title:"Slay the Spire 2",tier:"S",image:"images/Slay The Spire 2.png",review:"Replace with review text."},

{title:"Big Walk",tier:"A",image:"images/Big Walk.png",review:"Replace with review text."},
{title:"Kaizen: A Factory Story",tier:"A",image:"images/Kaizen A Factory Story.png",review:"Replace with review text."},
{title:"Marvel's Spider-Man 2",tier:"A",image:"images/Marvels Spider-Man 2.webp",review:"Replace with review text."},
{title:"Mina the Hollower",tier:"A",image:"images/Mina the Hollower.png",review:"Replace with review text."},
{title:"Opus Magnum: De Re Metallica",tier:"A",image:"images/Opus Magnum De Re Metallica.jpg",review:"Replace with review text."},
{title:"Sifu",tier:"A",image:"images/Sifu.jpg",review:"Replace with review text."},
{title:"Two Point Museum",tier:"A",image:"images/Two Point Museum.png",review:"Replace with review text."},
{title:"Well Dweller",tier:"A",image:"images/Well Dweller.jpg",review:"Replace with review text."},

{title:"Castlevania",tier:"B",image:"images/Castlevania Belmont's Curse.png",review:"Replace with review text."},
{title:"Dogpile",tier:"B",image:"images/Dogpile.jpg",review:"Replace with review text."},
{title:"Kabuto Park",tier:"B",image:"images/Kabuto Park.png",review:"Replace with review text."},
{title:"LEGO Voyagers",tier:"B",image:"images/LEGO Voyagers.jpg",review:"Replace with review text."},
{title:"Nintendo Switch Sports Resort",tier:"B",image:"images/Nintendo Switch Sports Resort.avif",review:"Replace with review text."},
{title:"Sheepo",tier:"B",image:"images/Sheepo.png",review:"Replace with review text."},
{title:"The Outer Worlds 2",tier:"B",image:"images/The Outer Worlds 2.jpg",review:"Replace with review text."},
{title:"UVS Nirmana",tier:"B",image:"images/UVS Nirmana.png",review:"Replace with review text."},

{title:"Subnautica Below Zero",tier:"C",image:"images/Subnautica Below Zero.jpg",review:"Replace with review text."},
{title:"The Signal State",tier:"C",image:"images/The Signal State.webp",review:"Replace with review text."},
{title:"Wo Long: Fallen Dynasty",tier:"C",image:"images/Wo Long Fallen Dynasty.png",review:"Replace with review text."},
{title:"Beast of Reincarnation",tier:"C",image:"images/Beast of Reincarnation.jpg",review:"Replace with review text."},

{title:"Katamari Royal Reverie",tier:"D",image:"images/Katamari Royal Reverie.jpg",review:"Replace with review text."},
{title:"Metroid Prime 4 Beyond",tier:"D",image:"images/Metroid Prime 4 Beyond.png",review:"Replace with review text."},

{title:"Forza Horizon 6",tier:"DNF",image:"images/Forza Horizon 6.png",review:"Replace with review text."},
{title:"Pinball Spire",tier:"DNF",image:"images/Pinball Spire.jpg",review:"Replace with review text."},
{title:"Resident Evil 4",tier:"DNF",image:"images/Resident Evil 4.png",review:"Replace with review text."}

];

const tierOrder = ["S","A","B","C","D","DNF"];

let currentGame = null;

function getTierClass(tier){

    if(tier==="DNF") return "tier-dnf";

    return `tier-${tier.toLowerCase()}`;
}

const container = document.getElementById("tiers");

function getVisibleGames(){

    return games;
}

function showReview(game){

    currentGame = game;

    document
        .querySelectorAll(".review-card")
        .forEach(x=>x.remove());

    document
        .querySelectorAll(".game-card")
        .forEach(x=>x.classList.remove("active"));

    const card = document.querySelector(
        `[data-title="${CSS.escape(game.title)}"]`
    );

    card.classList.add("active");

    const review = document.createElement("div");

    review.className = "review-card";

    review.innerHTML = `
    <div class="review-layout">

        <img
            class="review-image"
            src="${game.image}"
            alt="${game.title}">

        <div class="review-content">

            <div class="nav-buttons">
                <button onclick="previousGame()">← Previous</button>
                <button onclick="nextGame()">Next →</button>
            </div>

            <div class="review-title">
                ${game.title}
            </div>

            <div class="review-text">
                ${game.review}
            </div>

        </div>

    </div>
    `;

    card.closest(".tier-content")
        .appendChild(review);

    review.scrollIntoView({
        behavior:"smooth",
        block:"nearest"
    });

}

function previousGame(){

    const index =
        games.findIndex(g=>g.title===currentGame.title);

    const previous =
        games[(index-1+games.length)%games.length];

    showReview(previous);
}

function nextGame(){

    const index =
        games.findIndex(g=>g.title===currentGame.title);

    const next =
        games[(index+1)%games.length];

    showReview(next);
}

tierOrder.forEach(tier=>{

    const tierGames =
        games.filter(g=>g.tier===tier);

    const section =
        document.createElement("section");

    section.className = "tier";

    section.innerHTML = `
    <div class="tier-header ${getTierClass(tier)}">
    ${tier==="DNF" ? "Did Not Finish" : tier+" Tier"}
    </div>

    <div class="tier-content">

        <div class="game-grid">

        ${tierGames.map(game=>`

            <div
                class="game-card"
                data-title="${game.title}">

                <img
                    src="${game.image}"
                    alt="${game.title}">

                <div class="game-title">
                    ${game.title}
                </div>

            </div>

        `).join("")}

        </div>

    </div>
    `;

    container.appendChild(section);

});

document.addEventListener("click", e=>{

    const card =
        e.target.closest(".game-card");

    if(card){

        const game =
            games.find(
                g=>g.title===card.dataset.title
            );

        showReview(game);
    }

    const header =
        e.target.closest(".tier-header");

    if(header){

        header
            .closest(".tier")
            .classList.toggle("collapsed");
    }

});

let touchStartX = 0;

document.addEventListener("touchstart", e=>{

    touchStartX = e.changedTouches[0].clientX;

});

document.addEventListener("touchend", e=>{

    if(!currentGame) return;

    let touchEndX =
        e.changedTouches[0].clientX;

    let diff = touchStartX - touchEndX;

    if(Math.abs(diff) < 50) return;

    if(diff > 0){

        nextGame();

    } else {

        previousGame();
    }

});

</script>

</body>
</html>
