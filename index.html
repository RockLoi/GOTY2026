<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lee's GOTY Tier List</title>

<style>
:root{
    --bg:#0f1117;
    --panel:#181c24;
    --panel-hover:#242b3d;
    --border:#30364a;
    --text:#edf1f7;
    --muted:#9da6b8;

    --s:#ffb703;
    --a:#90be6d;
    --b:#4cc9f0;
    --c:#c77dff;
    --d:#808080;
    --dnf:#8b0000;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,system-ui,sans-serif;
    line-height:1.6;
}

.container{
    width:min(1400px,95%);
    margin:auto;
    padding:20px;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:2.5rem;
}

header p{
    color:var(--muted);
}

.tier{
    margin-bottom:28px;
}

.tier-header{
    padding:14px 18px;
    font-size:1.3rem;
    font-weight:bold;
    border-radius:12px;
    margin-bottom:12px;
}

.tier-s{
    background:var(--s);
    color:black;
}

.tier-a{
    background:var(--a);
    color:black;
}

.tier-b{
    background:var(--b);
    color:black;
}

.tier-c{
    background:var(--c);
}

.tier-d{
    background:var(--d);
}

.tier-dnf{
    background:var(--dnf);
}

.game-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

@media(min-width:700px){

    .game-grid{
        grid-template-columns:
        repeat(auto-fill,minmax(150px,1fr));
    }
}

.game-card{
    background:var(--panel);
    border-radius:12px;
    overflow:hidden;
    border:2px solid transparent;
    cursor:pointer;
    transition:.2s;
}

.game-card:hover{
    transform:translateY(-3px);
    background:var(--panel-hover);
}

.game-card.active{
    border-color:white;
    transform:translateY(-3px);
    box-shadow:
        0 0 0 2px white,
        0 0 20px rgba(255,255,255,.25);
}
    
.game-card img{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    display:block;
}

.game-title{
    padding:8px;
    text-align:center;
    font-size:.85rem;
}

.review-card{
    margin-top:15px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
}

.review-layout{
    display:block;
}

.review-image{
    width:100%;
    display:block;
    object-fit:cover;
}

.review-content{
    padding:22px;
}

.review-title{
    font-size:2rem;
    margin-bottom:10px;
}

.review-tier{
    display:inline-block;
    padding:6px 14px;
    border-radius:999px;
    font-weight:bold;
    margin-bottom:20px;
}

.review-text{
    white-space:pre-line;
}

.nav-buttons{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.nav-buttons button{
    background:#39415a;
    color:white;
    border:none;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
}

.nav-buttons button:hover{
    background:#4a5470;
}

@media(min-width:900px){

    .review-layout{
        display:grid;
        grid-template-columns:320px 1fr;
    }

    .review-image{
        height:100%;
    }
}
</style>
</head>
<body>

<div class="container">

<header>
    <h1>🏆 Lee's GOTY Tier List</h1>
    <p>Tap a game cover to read my thoughts.</p>
</header>

<div id="tiers"></div>

</div>

<script>

const games = [

/* B */

review:`Replace with your review.`
},

{
title:"Dogpile",
tier:"B",
image:"images/Dogpile.jpg",
review:`Replace with your review.`
},

{
title:"Kabuto Park",
tier:"B",
image:"images/Kabuto Park.png",
review:`Replace with your review.`
},

{
title:"LEGO Voyagers",
tier:"B",
image:"images/LEGO Voyagers.jpg",
review:`Replace with your review.`
},

{
title:"Nintendo Switch Sports Resort",
tier:"B",
image:"images/Nintendo Switch Sports Resort.avif",
review:`Replace with your review.`
},

{
title:"Sheepo",
tier:"B",
image:"images/Sheepo.png",

tier:"B",

/* C */

{

tier:"C",
image:"images/Subnautica Below Zero.jpg",
review:`Replace with your review.`

{
title:"The Signal State",
tier:"C",
image:"images/The Signal State.webp",

{
title:"Wo Long: Fallen Dynasty",
tier:"C",

},

{

/* D */

{
title:"Katamari Royal Reverie",
tier:"D",
image:"images/Katamari Royal Reverie.jpg",
review:`Replace with your review.`
},

{
title:"Metroid Prime 4 Beyond",
tier:"D",
image:"images/Metroid Prime 4 Beyond.png",
review:`Replace with your review.`
},

/* DNF */

{
title:"Forza Horizon 6",
tier:"DNF",
image:"images/Forza Horizon 6.png",
review:`Replace with your review.`
},

{
title:"Pinball Spire",
tier:"DNF",
image:"images/Pinball Spire.jpg",
review:`Replace with your review.`
},

{
title:"Resident Evil 4",
tier:"DNF",
image:"images/Resident Evil 4.png",
review:`Replace with your review.`
}

];

const tierOrder = ["S","A","B","C","D","DNF"];

let currentGame = null;

function getTierClass(tier){

    if(tier === "DNF"){
        return "tier-dnf";
    }

    return `tier-${tier.toLowerCase()}`;
}

function getTierText(tier){

    if(tier === "DNF"){
        return "Did Not Finish";
    }

    return `${tier} Tier`;
}

function showReview(game){

    currentGame = game;

    document
        .querySelectorAll(".review-card")
        .forEach(card => card.remove());

    document
        .querySelectorAll(".game-card")
        .forEach(card => card.classList.remove("active"));

    const selectedCard = document.querySelector(
        `[data-title="${CSS.escape(game.title)}"]`
    );

    selectedCard.classList.add("active");

    const reviewCard = document.createElement("div");

    reviewCard.className = "review-card";

    reviewCard.innerHTML = `
        <div class="review-layout">

            <img
                class="review-image"
                src="${game.image}"
                alt="${game.title}">

            <div class="review-content">

                <div class="nav-buttons">
                    <button onclick="previousGame()">
                        ← Previous
                    </button>

                    <button onclick="nextGame()">
                        Next →
                    </button>
                </div>

                <div class="review-title">
                    ${game.title}
                </div>

                <div class="review-tier ${getTierClass(game.tier)}">
                    ${getTierText(game.tier)}
                </div>

                <div class="review-text">
                    ${game.review}
                </div>

            </div>

        </div>
    `;

    selectedCard
        .closest(".tier")
        .appendChild(reviewCard);

    reviewCard.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });
}

function nextGame(){

    const index = games.findIndex(
        game => game.title === currentGame.title
    );

    const next =
        games[(index + 1) % games.length];

    showReview(next);
}

function previousGame(){

    const index = games.findIndex(
        game => game.title === currentGame.title
    );

    const previous =
        games[
          (index - 1 + games.length)
          % games.length
        ];

    showReview(previous);
}

const tiersContainer =
    document.getElementById("tiers");

tierOrder.forEach(tier => {

    const tierGames =
        games.filter(game => game.tier === tier);

    const section =
        document.createElement("section");

    section.className = "tier";

    section.innerHTML = `
        <div class="tier-header ${getTierClass(tier)}">
            ${getTierText(tier)}
        </div>

        <div class="game-grid">

            ${tierGames.map(game => `

                <div
                    class="game-card"
                    data-title="${game.title}">

                    <img
                        src="${game.image}"
                        alt="${game.title}">

                    <div class="game-title">
                        ${game.title}
                    </div>

                </div>

            `).join("")}

        </div>
    `;

    tiersContainer.appendChild(section);
});

document.addEventListener("click", event => {

    const card =
        event.target.closest(".game-card");

    if(!card) return;

    const game =
        games.find(
            g => g.title === card.dataset.title
        );

    if(!game) return;

    const isAlreadyOpen =
        currentGame &&
        currentGame.title === game.title;

    if(isAlreadyOpen){

        document
            .querySelectorAll(".review-card")
            .forEach(card => card.remove());

        document
            .querySelectorAll(".game-card")
            .forEach(card =>
                card.classList.remove("active")
            );

        currentGame = null;

        return;
    }

    showReview(game);

});

let touchStartX = 0;

document.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0].clientX;
    }
);

document.addEventListener(
    "touchend",
    event => {

        if(!currentGame) return;

        const touchEndX =
            event.changedTouches[0].clientX;

        const difference =
            touchStartX - touchEndX;

        if(Math.abs(difference) < 50){
            return;
        }

        if(difference > 0){
            nextGame();
        }
        else{
            previousGame();
        }
    }
);

</script>
