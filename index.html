<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My GOTY Tier List</title>

<style>
:root{
    --bg:#0f1117;
    --panel:#181c24;
    --panel-hover:#222838;
    --text:#e8eaf0;
    --muted:#a8afc1;
    --border:#30364a;

    --s:#ffb703;
    --a:#90be6d;
    --b:#4cc9f0;
    --c:#c77dff;
    --d:#6c757d;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.6;
}

.container{
    width:min(1200px,95%);
    margin:auto;
    padding:20px;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:2.5rem;
}

header p{
    color:var(--muted);
}

.review-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:30px;
    min-height:250px;
}

.review-content{
    padding:20px;
}

.review-cover{
    width:100%;
    max-height:450px;
    object-fit:cover;
    display:block;
}

.review-title{
    font-size:2rem;
    margin-bottom:10px;
}

.review-tier{
    display:inline-block;
    padding:4px 12px;
    border-radius:999px;
    font-weight:bold;
    margin-bottom:15px;
}

.review-text{
    white-space:pre-line;
}

.placeholder{
    padding:50px 20px;
    text-align:center;
    color:var(--muted);
}

.tier{
    margin-bottom:25px;
}

.tier-header{
    padding:12px 16px;
    font-size:1.4rem;
    font-weight:bold;
    border-radius:12px;
    margin-bottom:10px;
}

.tier-s{background:var(--s); color:#000;}
.tier-a{background:var(--a); color:#000;}
.tier-b{background:var(--b); color:#000;}
.tier-c{background:var(--c); color:#fff;}
.tier-d{background:var(--d); color:#fff;}

.game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
    gap:12px;
}

.game-card{
    border:none;
    background:var(--panel);
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
    border:2px solid transparent;
}

.game-card:hover{
    transform:translateY(-3px);
    background:var(--panel-hover);
}

.game-card.active{
    border-color:white;
}

.game-card img{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    display:block;
}

.game-title{
    padding:8px;
    font-size:.85rem;
    text-align:center;
}

@media (min-width:900px){

    .review-content-wrapper{
        display:grid;
        grid-template-columns:300px 1fr;
    }

    .review-cover{
        height:100%;
        max-height:none;
    }
}
</style>
</head>
<body>

<div class="container">

<header>
    <h1>🏆 My GOTY Tier List</h1>
    <p>Tap a cover to read my thoughts.</p>
</header>

<div class="review-panel" id="reviewPanel">
    <div class="placeholder">
        Select a game to view the review.
    </div>
</div>

<div id="tiers"></div>

</div>

<script>

/*
===================================================
EDIT YOUR GAMES HERE
===================================================
Place images inside:

images/

Example:
images/balatro.jpg
images/rebirth.jpg
===================================================
*/

const games = [

{
    title: "Example S Tier Game",
    tier: "S",
    image: "images/example-s.jpg",
    review: `
Paragraph one goes here.

Paragraph two goes here.

This section supports multiple paragraphs naturally.
`
},

{
    title: "Another S Tier Game",
    tier: "S",
    image: "images/example-s2.jpg",
    review: `
Why this game deserves S tier.

Add as much text as you like.
`
},

{
    title: "Great A Tier Game",
    tier: "A",
    image: "images/example-a.jpg",
    review: `
Your review here.
`
},

{
    title: "Solid B Tier Game",
    tier: "B",
    image: "images/example-b.jpg",
    review: `
Your review here.
`
},

{
    title: "Mixed C Tier Game",
    tier: "C",
    image: "images/example-c.jpg",
    review: `
Your review here.
`
},

{
    title: "Disappointing D Tier Game",
    tier: "D",
    image: "images/example-d.jpg",
    review: `
Your review here.
`
}

];

const tierOrder = ["S","A","B","C","D"];

const reviewPanel = document.getElementById("reviewPanel");
const tierContainer = document.getElementById("tiers");

function getTierClass(tier){
    return `tier-${tier.toLowerCase()}`;
}

function showGame(game){

    reviewPanel.innerHTML = `
        <div class="review-content-wrapper">
            ${game.image}
            <div class="review-content">
                <div class="review-title">${game.title}</div>

                <div class="review-tier ${getTierClass(game.tier)}">
                    ${game.tier} Tier
                </div>

                <div class="review-text">
                    ${game.review}
                </div>
            </div>
        </div>
    `;

    document
        .querySelectorAll(".game-card")
        .forEach(card => card.classList.remove("active"));

    const active = document.querySelector(
        `[data-title="${CSS.escape(game.title)}"]`
    );

    if(active){
        active.classList.add("active");
    }

    reviewPanel.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });
}

tierOrder.forEach(tier => {

    const tierGames = games.filter(g => g.tier === tier);

    if(!tierGames.length) return;

    const section = document.createElement("section");
    section.className = "tier";

    section.innerHTML = `
        <div class="tier-header ${getTierClass(tier)}">
            ${tier} Tier
        </div>

        <div class="game-grid">
            ${tierGames.map(game => `
                <button
                    class="game-card"
                    data-title="${game.title}">

                    ${game.image}

                    <div class="game-title">
                        ${game.title}
                    </div>
                </button>it's why many people I know use a console when 15 years ago they used a PC, and that's even without any kind of hacking or pira
            `).join("")}
        </div>
    `;

    tierContainer.appendChild(section);
});

document.querySelectorAll(".game-card").forEach(card => {

    card.addEventListener("click", () => {

        const title = card.dataset.title;
        const game = games.find(g => g.title === title);

        if(game){
            showGame(game);
        }
    });

});

</script>

</body>
</html>
